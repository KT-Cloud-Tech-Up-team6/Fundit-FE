name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check BOM
        run: pnpm lint:bom

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  verify-image:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: fundit-frontend:pr-${{ github.sha }}
      # PR images use fixtures, not live PortOne/Toss configuration.
      NEXT_PUBLIC_PORTONE_STORE_ID: store-ci-build-check
      NEXT_PUBLIC_PORTONE_CHANNEL_KEY: channel-key-ci-build-check
      NEXT_PUBLIC_TOSS_CLIENT_KEY: client-key-ci-build-check
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_PORTONE_STORE_ID \
            --build-arg NEXT_PUBLIC_PORTONE_CHANNEL_KEY \
            --build-arg NEXT_PUBLIC_TOSS_CLIENT_KEY \
            --tag "$IMAGE" .

      - name: Verify container
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:3000:3000 "$IMAGE")
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-all-errors --retry-max-time 30 http://127.0.0.1:3000/ --output /dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/logo.svg --output /dev/null

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPOSITORY: fundit-frontend
      IMAGE_TAG: sha-${{ github.sha }}
      NEXT_PUBLIC_PORTONE_STORE_ID: ${{ vars.NEXT_PUBLIC_PORTONE_STORE_ID }}
      NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${{ vars.NEXT_PUBLIC_PORTONE_CHANNEL_KEY }}
      NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
      # 소셜 로그인 client ID는 비어 있어도 배포된다(버튼이 비활성). 필수 변수 검사에 넣지 않는다.
      NEXT_PUBLIC_KAKAO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check PortOne/Toss build configuration
        run: |
          for name in NEXT_PUBLIC_PORTONE_STORE_ID NEXT_PUBLIC_PORTONE_CHANNEL_KEY NEXT_PUBLIC_TOSS_CLIENT_KEY; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::Missing repository variable: $name. Set it under Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi
          done

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_PORTONE_STORE_ID \
            --build-arg NEXT_PUBLIC_PORTONE_CHANNEL_KEY \
            --build-arg NEXT_PUBLIC_TOSS_CLIENT_KEY \
            --build-arg NEXT_PUBLIC_KAKAO_CLIENT_ID \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID \
            --tag "$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Verify container
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:3000:3000 "$ECR_REPOSITORY:$IMAGE_TAG")
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-all-errors --retry-max-time 30 http://127.0.0.1:3000/ --output /dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/logo.svg --output /dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::899957568205:role/fundit-frontend-ci-role
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" "$image_uri"
          docker push "$image_uri"
          printf 'Image: `%s`\nPlatform: `linux/amd64`\nCommit: `%s`\n' "$image_uri" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch GitOps image update
        env:
          GH_TOKEN: ${{ secrets.FUNDIT_GITOPS_TOKEN }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Missing FUNDIT_GITOPS_TOKEN Actions secret.'
            exit 1
          fi

          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          image_digest="$(docker buildx imagetools inspect "$image_uri" \
            --format '{{json .Manifest}}' | jq -r '.digest // empty')"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Could not read the pushed image digest.'
            exit 1
          fi

          gh workflow run cd-dispatch-frontend-image.yml \
            --repo KT-Cloud-Tech-Up-team6/Fundit-GitOps \
            --ref main \
            -f image_tag="$IMAGE_TAG" \
            -f image_digest="$image_digest" \
            -f source_sha="$GITHUB_SHA"

          printf 'GitOps image update requested for `%s` (`%s`).\n' \
            "$IMAGE_TAG" "$image_digest" >> "$GITHUB_STEP_SUMMARY"
